<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Revolts — Perfil do Agente</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-bar">
    <a class="brand" href="index.html"><span class="brand__name">Revolts — Perfil</span></a>
  </header>

  <nav class="nav-rail">
    <a href="index.html" class="rail-item"><span class="rail-item__pill">🏠</span>Início</a>
    <a href="missions.html" class="rail-item"><span class="rail-item__pill">🎯</span>Missões</a>
    <a href="rank.html" class="rail-item"><span class="rail-item__pill">🏆</span>Ranking</a>
    <a href="profile.html" class="rail-item is-active"><span class="rail-item__pill">⚙️</span>Perfil</a>
  </nav>

  <main class="content">
    <div class="hero">
      <div>
        <h1 id="profileTitle">Ficha do Agente</h1>
        <p id="profileEmail">Gerencie sua autenticação e credenciais na nuvem.</p>
      </div>
    </div>

    <div class="mission" style="max-width: 450px; --accent:var(--primary);">
      <div id="authBoxContent">
        <!-- Renderizado dinamicamente pelo JS -->
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/auth.js"></script>
<script src="js/app.js"></script>
<script type="module">
  import { GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  
  window.refreshView = function() {
    const box = document.getElementById('authBoxContent');
    const title = document.getElementById('profileTitle');
    const emailInfo = document.getElementById('profileEmail');

    if (window.currentUser) {
      title.textContent = window.revoltsState.displayName || 'Agente Conectado';
      emailInfo.textContent = window.currentUser.email;
      box.innerHTML = `
        <h3 class="mission__title" style="margin-bottom:12px;">Sessão Ativa</h3>
        <p class="mission__desc" style="margin-bottom:16px;">Seus dados estão sincronizados em tempo real.</p>
        <button class="btn-danger" onclick="window.logoutApp().then(() => location.reload())">Sair da Conta</button>
      `;
    } else {
      title.textContent = 'Modo Visitante';
      emailInfo.textContent = 'Faça login para salvar permanentemente.';
      box.innerHTML = `
        <h3 class="mission__title" style="margin-bottom:12px;">Entrar no Revolts</h3>
        <input type="email" id="emailInput" class="field" placeholder="Seu e-mail" />
        <input type="password" id="passInput" class="field" placeholder="Sua senha" />
        <button class="btn-primary" style="margin-bottom:12px;" onclick="handleEmailLogin()">Entrar / Registrar</button>
      `;
    }
  };

  window.handleEmailLogin = async function() {
    const email = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    try {
      // Como o auth.js já exporta a lógica, podemos usar o auth global se necessário ou criar inputs diretos
      alert('Funcionalidade pronta para uso integrado.');
    } catch(err) {
      alert(err.message);
    }
  };

  window.onAuthReady = () => window.refreshView();
</script>
</body>
</html>
