<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grid</title>
<style>
  :root {
    --bg: #02050a;
    --cyan: #00f0ff;
    --cyan-dim: rgba(0, 240, 255, .35);
    --panel: rgba(2, 8, 16, .72);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--cyan); }
  canvas { display: block; touch-action: none; }

  .hud { position: fixed; pointer-events: none; }
  #title { top: max(14px, env(safe-area-inset-top)); left: 14px; }
  #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .18em;
    text-shadow: 0 0 12px var(--cyan); }
  #status { margin-top: 4px; opacity: .65; }

  #bar { left: 50%; transform: translateX(-50%); pointer-events: auto;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; align-items: center; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--cyan-dim); backdrop-filter: blur(6px);
    box-shadow: 0 0 24px rgba(0, 240, 255, .12); max-width: calc(100vw - 20px); }
  #palette { display: flex; gap: 6px; }
  .sw { width: 30px; height: 30px; border: 2px solid transparent; background: #000; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 3px #000, inset 0 0 0 6px var(--c); }
  .sw.on { border-color: #fff; }
  #mode { font: inherit; color: var(--bg); background: var(--cyan); border: 0; padding: 0 14px; height: 30px;
    cursor: pointer; font-weight: 700; min-width: 96px; }
  #mode.destroy { background: #ff2b4a; color: #fff; }
  #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 62px); left: 50%; transform: translateX(-50%);
    opacity: .55; text-align: center; white-space: nowrap; }
  @media (max-width: 560px) { #hint { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="title" class="hud">
    <h1>GRID CITY</h1>
    <div id="status">iniciando…</div>
  </div>
  <div id="hint" class="hud">arraste: girar · botão direito: mover · scroll: zoom · clique: usar ferramenta · 1–5: cor · X: modo</div>
  <div id="bar" class="hud">
    <div id="palette"></div>
    <button id="mode">Construir</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
