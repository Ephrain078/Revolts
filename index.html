<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REVOLTS Lite</title>
<style>
html,body{margin:0;height:100%;background:#02050a;color:#0ff;font:14px monospace;overflow:hidden;user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
canvas{width:min(92vw,66vh);aspect-ratio:1;image-rendering:pixelated;border:1px solid #0ff;box-shadow:0 0 24px #0ff6}
pre{margin:0;line-height:.62;font-size:min(2.2vw,1.6vh)}
#b{display:flex;gap:12px}
button{font:inherit;font-size:26px;color:#0ff;background:#0ff1;border:1px solid #0ff8;width:42vw;max-width:180px;height:64px}
button:active{background:#0ff4}
</style>
<div id="h">REVOLTS LITE · toque ◀ ou ▶ para começar</div>
<canvas id="c"></canvas><pre id="a" hidden></pre>
<div id="b"><button id="l">◀</button><button id="r">▶</button></div>
<script>
/* REVOLTS Lite — ~50 KB de RAM, zero alocação no loop, zero bibliotecas.
   ?n=48  → arena menor (mais leve)   ·   #ascii → modo texto (sem canvas) */
const A = location.hash == '#ascii',
      N = +new URLSearchParams(location.search).get('n') || (A ? 40 : 96), H = N >> 1,
      $ = id => document.getElementById(id);

/* 1) Estado: um único Uint8Array. 0 livre · 255 prédio · 1..4 trilha da moto */
const g = new Uint8Array(N * N);

/* 2) Vídeo: 1 pixel por célula (96x96). A GPU/CSS amplia — a CPU toca 9 mil pixels */
const cv = $('c'), ctx = cv.getContext('2d');
cv.width = cv.height = N;
const img = ctx.createImageData(N, N), px = new Uint32Array(img.data.buffer); // ABGR
const BG = 0xFF0A0502, WALL = 0xFF4A2A0A, HEAD = 0xFFFFFFFF,
      COL = [0xFFFFF000, 0xFF007AFF, 0xFFD62BFF, 0xFF00E6FF]; // ciano, laranja, magenta, amarelo
if (A) { cv.hidden = true; $('a').hidden = false; }

/* 3) Motos em arrays tipados (sem objetos, sem coletor de lixo) */
const X = new Int16Array(4), Z = new Int16Array(4), DX = new Int8Array(4), DZ = new Int8Array(4),
      NX = new Int16Array(4), NZ = new Int16Array(4), al = new Uint8Array(4), dead = new Uint8Array(4);
const o = Math.round(N * .35), SP = [[-o, -o, 1, 0], [o, o, -1, 0], [-o, o, 0, -1], [o, -o, 0, 1]];
const NODES = [[0, 0], [50, 50], [-50, -50], [100, 0], [0, 100], [-100, 20], [30, -80]]; // Palmas

let running = 0, dirty = 1, ticks = 0, kills = 0, T = .09, acc = 0, last = 0, q0 = 0, q1 = 0, best = 0;
try { best = +localStorage.getItem('rl') || 0; } catch (e) {}

const inb = (x, z) => x >= 0 && z >= 0 && x < N && z < N;

function init() {
  g.fill(0); px.fill(BG);
  for (const [a, b] of NODES) {
    const cx = H + Math.round(a * N / 211), cz = H + Math.round(b * N / 211);
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      const x = cx + dx, z = cz + dz;
      if (x > 0 && z > 0 && x < N - 1 && z < N - 1) { g[z * N + x] = 255; px[z * N + x] = WALL; }
    }
  }
  dirty = 1;
}
function start() {
  init(); ticks = kills = 0; T = .09; acc = 0; q0 = q1 = 0;
  for (let i = 0; i < 4; i++) {
    const s = SP[i]; X[i] = H + s[0]; Z[i] = H + s[1]; DX[i] = s[2]; DZ[i] = s[3]; al[i] = 1;
    const k = Z[i] * N + X[i]; g[k] = i + 1; px[k] = HEAD;
  }
  running = 1;
}
function turn(i, d) { const x = DX[i]; if (d < 0) { DX[i] = DZ[i]; DZ[i] = -x; } else { DX[i] = -DZ[i]; DZ[i] = x; } }
function look(i, dx, dz) { // IA: células livres à frente (máx. 12) — custo fixo e minúsculo
  let n = 0, x = X[i] + dx, z = Z[i] + dz;
  while (n < 12 && inb(x, z) && !g[z * N + x]) { n++; x += dx; z += dz; }
  return n;
}
function steer(i) {
  if (!i) { const d = q0; if (d) { q0 = q1; q1 = 0; turn(0, d); } return; }
  const a = look(i, DX[i], DZ[i]);
  if (a > 3 && Math.random() > .012) return;
  const l = look(i, DZ[i], -DX[i]), r = look(i, -DZ[i], DX[i]);
  if (a <= 3 ? (l || r) : Math.max(l, r) > 8) turn(i, l == r ? (Math.random() < .5 ? -1 : 1) : l > r ? -1 : 1);
}
function kill(i) { // a trilha some (limpa só quando alguém morre)
  al[i] = 0;
  for (let k = 0; k < g.length; k++) if (g[k] == i + 1) { g[k] = 0; px[k] = BG; }
  if (i) kills++;
}
function tick() {
  ticks++;
  for (let i = 0; i < 4; i++) if (al[i]) {
    steer(i); NX[i] = X[i] + DX[i]; NZ[i] = Z[i] + DZ[i];
    dead[i] = !inb(NX[i], NZ[i]) || g[NZ[i] * N + NX[i]] != 0;
  }
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++)
    if (al[i] && al[j] && NX[i] == NX[j] && NZ[i] == NZ[j]) dead[i] = dead[j] = 1;
  for (let i = 0; i < 4; i++) if (al[i] && !dead[i]) {
    px[Z[i] * N + X[i]] = COL[i]; X[i] = NX[i]; Z[i] = NZ[i];
    const k = Z[i] * N + X[i]; g[k] = i + 1; px[k] = HEAD; // só 2 pixels mudam por moto
  }
  for (let i = 0; i < 4; i++) if (al[i] && dead[i]) kill(i);
  dirty = 1; T = Math.max(.05, .09 - ticks * .00004);
  const rivals = al[1] + al[2] + al[3], s = ticks + kills * 100;
  if (!al[0] || !rivals) {
    running = 0; const w = al[0], p = s + (w ? 500 : 0);
    if (p > best) { best = p; try { localStorage.setItem('rl', p); } catch (e) {} }
    $('h').textContent = (w ? 'VITÓRIA' : 'DEREZZED') + ' · ' + p + ' pts · recorde ' + best + ' · toque para jogar';
  } else $('h').textContent = s + ' pts · ' + rivals + ' rivais';
}
function draw() {
  if (!A) return ctx.putImageData(img, 0, 0); // 1 chamada por mudança
  let s = '';
  for (let z = 0; z < N; z++) { for (let x = 0; x < N; x++) { const v = g[z * N + x]; s += v == 255 ? '#' : '.@ox+'[v]; } s += '\n'; }
  $('a').textContent = s;
}

/* 4) Passo fixo + desenho só quando algo mudou: entre ticks a CPU fica ociosa */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (running) { acc += dt; while (running && acc >= T) { acc -= T; tick(); } }
  if (dirty) { dirty = 0; draw(); }
}

/* Controles */
function press(d) { if (!running) start(); else if (!q0) q0 = d; else if (!q1) q1 = d; }
$('l').onpointerdown = e => { e.preventDefault(); press(-1); };
$('r').onpointerdown = e => { e.preventDefault(); press(1); };
cv.onclick = () => { if (!running) start(); };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k == 'arrowleft' || k == 'a') press(-1); else if (k == 'arrowright' || k == 'd') press(1);
  else if (k == 'enter' && !running) start();
});
init(); requestAnimationFrame(frame);
</script>
