<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Grid</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="hud">
        <div id="logo">REVOLTS</div>
        <div id="stat">0 pts · 3 rivais</div>
    </div>

    <div id="screen">
        <div class="card">
            <h1 id="ttl">REVOLTS 3D</h1>
            <p id="msg">
                Arena Tron 3D em Palmas.<br><br>
                Controles:<br>
                Teclas <b>W A S D</b> ou <b>Setas (▲ ▼ ◄ ►)</b><br>
                No celular, use o D-Pad de botões virtuais.
            </p>
            <button id="go">JOGAR</button>
        </div>
    </div>

    <div id="dpad">
        <div class="row">
            <button id="btn-up" class="pad-btn">▲</button>
        </div>
        <div class="row">
            <button id="btn-left" class="pad-btn">◄</button>
            <button id="btn-down" class="pad-btn">▼</button>
            <button id="btn-right" class="pad-btn">►</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
