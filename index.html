<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grid</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Container onde o Three.js vai injetar o canvas do jogo -->
    <div id="game-container"></div>

    <!-- Outros elementos de HUD / UI mobile -->
    <div id="mobile-ui" class="hidden">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
        <button id="jump-button">Pular</button>
    </div>

    <div id="hud">
        FPS: <span id="fps-value">60</span> | 
        Distância: <span id="dist-value">0.0</span>m | 
        Chunk: <span id="chunk-value">0,0</span>
    </div>

    <!-- Script principal do projeto -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
