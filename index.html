<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revolts — Início</title>
<link rel="stylesheet" href="style.css"> <!-- Se preferir separar o CSS também -->
</head>
<body>
<div class="app">
  <!-- Barra Superior -->
  <header class="app-bar">
    <a class="brand" href="index.html">
      <span class="brand__mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 2 2 13h4v9h5v-6h2v6h5v-9h4L12 2Z"/></svg></span>
      <span class="brand__name">Revolts</span>
    </a>
    <div class="app-bar__spacer"></div>
    <button class="icon-btn" id="themeToggle">🌓</button>
    <button class="auth-pill" onclick="location.href='profile.html'">
      <span class="auth-pill__avatar" id="headerAvatar">?</span>
      <span id="headerUserName">Entrar</span>
    </button>
  </header>

  <!-- Menu Lateral (Navegação entre páginas HTML) -->
  <nav class="nav-rail">
    <a href="index.html" class="rail-item is-active"><span class="rail-item__pill">🏠</span>Início</a>
    <a href="missions.html" class="rail-item"><span class="rail-item__pill">🎯</span>Missões</a>
    <a href="rank.html" class="rail-item"><span class="rail-item__pill">🏆</span>Ranking</a>
    <a href="profile.html" class="rail-item"><span class="rail-item__pill">⚙️</span>Perfil</a>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="content">
    <div class="hero">
      <div>
        <span style="font-size:.74rem; font-weight:600; color:var(--primary); text-transform:uppercase;">Arquitetura Multi-Página</span>
        <h1>Bem-vindo ao <em>Revolts</em></h1>
        <p>Sistema modular conectado ao Firebase. Acompanhe seu progresso e suba de nível.</p>
        <div class="hero__stats">
          <div class="stat-chip">⭐ XP: <strong id="statXp">0</strong></div>
          <div class="stat-chip">✅ Missões: <strong id="statMissions">0</strong></div>
        </div>
      </div>
      <div class="level-ring">
        <svg viewBox="0 0 100 100" width="140" height="140"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-3)" stroke-width="10"/><circle id="levelRingBar" cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-dasharray="264" stroke-dashoffset="264"/></svg>
        <div class="level-ring__label"><b id="levelNumber">1</b><span>Nível</span></div>
      </div>
    </div>

    <div class="section-head"><h2>Missões em Destaque</h2></div>
    <div class="mission-grid" id="homeMissionGrid"></div>
  </main>
</div>

<!-- Importa o script centralizado de nuvem -->
<script type="module" src="auth.js"></script>
<script type="module">
  window.refreshView = function() {
    const state = window.revoltsState;
    document.getElementById('statXp').textContent = state.xp;
    document.getElementById('statMissions').textContent = state.completed;
    const level = Math.floor(state.xp / 150) + 1;
    document.getElementById('levelNumber').textContent = level;
    
    const grid = document.getElementById('homeMissionGrid');
    grid.innerHTML = state.missions.slice(0, 2).map(m => `
      <div class="mission" onclick="completeMission('${m.id}')" style="--accent:var(--g-blue)">
        <div class="mission__top"><span class="mission__points">+${m.xp} XP</span></div>
        <h3 class="mission__title">${m.title}</h3>
        <p class="mission__desc">${m.desc}</p>
      </div>
    `).join('');
  };

  window.completeMission = function(id) {
    const m = window.revoltsState.missions.find(item => item.id === id);
    if (!m) return;
    m.done++;
    window.revoltsState.xp += m.xp;
    window.revoltsState.completed++;
    window.saveCloudDB();
    alert(`Missão concluída! +${m.xp} XP`);
  };

  window.onAuthReady = () => window.refreshView();
</script>
</body>
</html>
