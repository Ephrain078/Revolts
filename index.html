<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TRON ENGINE // Terreno Procedural 3D</title>
<style>
  :root{
    --neon:      #00eaff;
    --neon-dim:  #0b6b82;
    --neon-soft: rgba(0, 234, 255, .35);
    --bg:        #02060b;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    overflow:hidden;
    background:var(--bg);
  }

  body{
    font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    color:var(--neon);
    -webkit-font-smoothing:antialiased;
  }

  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* ---------- overlays de tela ---------- */
  .scanlines{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,234,255,.035) 0 1px,
      transparent 1px 3px
    );
    mix-blend-mode:screen;
    opacity:.65;
  }
  .vignette{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.88) 100%);
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; z-index:10; pointer-events:none;
    font-size:11px; line-height:1.9;
    letter-spacing:.18em; text-transform:uppercase;
    text-shadow:0 0 8px var(--neon-soft), 0 0 22px rgba(0,234,255,.18);
    opacity:.92;
  }
  .hud--tl{ top:18px; left:20px; }
  .hud--tr{ top:18px; right:20px; text-align:right; }
  .hud--bl{ bottom:18px; left:20px; }
  .hud--br{ bottom:18px; right:20px; text-align:right; }

  .hud__title{
    font-size:15px; font-weight:bold; letter-spacing:.42em;
    padding-bottom:6px; margin-bottom:8px;
    border-bottom:1px solid var(--neon-soft);
    text-shadow:0 0 10px var(--neon), 0 0 34px rgba(0,234,255,.45);
  }
  .hud__sub{ color:var(--neon-dim); font-size:10px; letter-spacing:.3em; }

  .hud__row{ display:flex; justify-content:space-between; gap:22px; }
  .hud__label{ color:var(--neon-dim); }
  .hud__value{ color:var(--neon); }

  kbd{
    display:inline-block;
    min-width:16px; padding:0 5px;
    border:1px solid var(--neon-soft);
    border-radius:2px;
    font-family:inherit; font-size:10px;
    color:var(--neon);
  }

  /* ---------- boot screen ---------- */
  .boot{
    position:fixed; inset:0; z-index:50;
    display:grid; place-items:center;
    background:radial-gradient(ellipse at center, #04121c 0%, #02060b 70%);
    transition:opacity .6s ease, visibility .6s ease;
  }
  .boot.is-hidden{ opacity:0; visibility:hidden; }

  .boot__inner{ width:min(340px, 72vw); text-align:center; }

  .boot__title{
    font-size:20px; font-weight:bold; letter-spacing:.5em;
    margin-bottom:4px;
    text-shadow:0 0 12px var(--neon), 0 0 40px rgba(0,234,255,.5);
  }
  .boot__sub{
    font-size:9px; letter-spacing:.34em; color:var(--neon-dim);
    margin-bottom:26px;
  }

  .boot__bar{
    height:2px; width:100%;
    background:rgba(0,234,255,.12);
    overflow:hidden;
    margin-bottom:12px;
  }
  .boot__bar span{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, transparent, var(--neon));
    box-shadow:0 0 12px var(--neon);
    animation:load 1.25s cubic-bezier(.3,.9,.3,1) forwards;
  }
  @keyframes load{ to{ width:100%; } }

  .boot__log{
    font-size:9px; letter-spacing:.28em; color:var(--neon-dim);
    animation:blink 1.1s steps(2, end) infinite;
  }
  @keyframes blink{ 50%{ opacity:.25; } }
</style>
</head>
<body>

  <div id="app"></div>

  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- ===================== HUD ===================== -->
  <div class="hud hud--tl">
    <div class="hud__title">TRON ENGINE</div>
    <div class="hud__sub">PROCEDURAL GRID v1.0</div>
  </div>

  <div class="hud hud--tr">
    <div class="hud__row"><span class="hud__label">FPS</span><span class="hud__value" id="statFps">--</span></div>
    <div class="hud__row"><span class="hud__label">Chunks</span><span class="hud__value" id="statChunks">--</span></div>
    <div class="hud__row"><span class="hud__label">Blocos</span><span class="hud__value" id="statBlocks">--</span></div>
    <div class="hud__row"><span class="hud__label">Draw calls</span><span class="hud__value" id="statCalls">--</span></div>
  </div>

  <div class="hud hud--bl">
    <div class="hud__row"><span class="hud__label">Rotacionar</span><span class="hud__value">Arrastar</span></div>
    <div class="hud__row"><span class="hud__label">Zoom</span><span class="hud__value">Scroll</span></div>
    <div class="hud__row"><span class="hud__label">Mover</span><span class="hud__value">Botão direito</span></div>
    <div class="hud__row"><span class="hud__label">Reset</span><span class="hud__value"><kbd>R</kbd></span></div>
  </div>

  <div class="hud hud--br">
    <div class="hud__sub">SETOR 7G · GRID ATIVO</div>
  </div>

  <!-- ===================== BOOT ===================== -->
  <div class="boot" id="boot">
    <div class="boot__inner">
      <div class="boot__title">TRON</div>
      <div class="boot__sub">INICIALIZANDO MOTOR 3D</div>
      <div class="boot__bar"><span></span></div>
      <div class="boot__log" id="bootLog">GERANDO SETORES PROCEDURAIS...</div>
    </div>
  </div>

  <!-- ===================== IMPORT MAP ===================== -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
