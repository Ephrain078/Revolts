<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C1B1F" />
<title>Revolts — Rede de Agentes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<script>
  try {
    var __t = localStorage.getItem('revolts_theme');
    if (__t === 'light' || __t === 'dark') document.documentElement.setAttribute('data-theme', __t);
  } catch (e) {}
</script>

<style>
:root{
  --font: 'Roboto', 'Google Sans', system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-xl: 32px; --r-full: 999px;
  --rail-w: 92px;
}

html[data-theme="dark"]{
  --bg: #1C1B1F; --glow-1: rgba(208,188,255,.10); --glow-2: rgba(204,194,220,.08); --glow-3: rgba(239,184,200,.08);
  --grid-line: rgba(230,225,229,.04); --surface: rgba(255,255,255,.04); --surface-hover: rgba(255,255,255,.08);
  --surface-solid: #211F26; --surface-high: #2B2930; --on-surface: #E6E1E5; --on-surface-variant: #CAC4D0;
  --outline: rgba(202,196,208,.16); --primary: #D0BCFF; --on-primary: #381E72; --primary-container: rgba(208,188,255,.16);
  --secondary: #CCC2DC; --secondary-container: rgba(204,194,220,.16); --tertiary: #EFB8C8; --success: #81C995; --danger: #F2B8B5;
  --shadow: 0 24px 70px rgba(0,0,0,.55); --shadow-soft: 0 10px 30px rgba(0,0,0,.30);
}

html[data-theme="light"]{
  --bg: #FFFBFE; --glow-1: rgba(103,80,164,.10); --glow-2: rgba(98,91,113,.08); --glow-3: rgba(125,82,96,.08);
  --grid-line: rgba(28,27,31,.04); --surface: rgba(255,255,255,.72); --surface-hover: rgba(255,255,255,.95);
  --surface-solid: #FFFBFE; --surface-high: #F3EDF7; --on-surface: #1C1B1F; --on-surface-variant: #49454F;
  --outline: rgba(121,116,126,.20); --primary: #6750A4; --on-primary: #FFFFFF; --primary-container: rgba(103,80,164,.12);
  --secondary: #625B71; --secondary-container: rgba(98,91,113,.12); --tertiary: #7D5260; --success: #188038; --danger: #B3261E;
  --shadow: 0 20px 46px rgba(28,27,31,.14); --shadow-soft: 0 8px 22px rgba(28,27,31,.10);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body{
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--on-surface);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .35s var(--ease), color .35s var(--ease);
}
body::before{
  content: ''; position: fixed; inset: 0; z-index: -2;
  background: radial-gradient(900px 620px at 10% -12%, var(--glow-1), transparent 62%),
              radial-gradient(820px 600px at 102% -4%, var(--glow-2), transparent 58%),
              radial-gradient(760px 720px at 55% 112%, var(--glow-3), transparent 62%);
  pointer-events: none;
}
body::after{
  content: ''; position: fixed; inset: 0; z-index: -1;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: radial-gradient(circle at 50% 18%, #000 0%, transparent 78%);
  pointer-events: none;
}
.material-symbols-rounded{
  font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px;
  line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none;
}
::selection { background: var(--primary-container); color: var(--on-surface); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outline); border-radius: var(--r-full); }

.app { display: flex; min-height: 100vh; }
.rail{
  position: fixed; inset: 0 auto 0 0; width: var(--rail-w); display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 18px 0 22px; z-index: 60; background: var(--surface); border-right: 1px solid var(--outline);
  backdrop-filter: blur(26px) saturate(170%); transition: background .35s var(--ease);
}
.rail-logo{
  width: 46px; height: 46px; border-radius: var(--r-md); display: grid; place-items: center;
  font-weight: 900; font-size: 22px; color: var(--on-primary); background: linear-gradient(135deg, var(--primary), var(--tertiary));
  box-shadow: 0 8px 24px rgba(103,80,164,.22); margin-bottom: 18px; user-select: none;
}
.rail-item{
  position: relative; width: 68px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border: none; border-radius: var(--r-md); background: transparent; color: var(--on-surface-variant);
  font-family: inherit; font-size: 10.5px; font-weight: 500; cursor: pointer; transition: background .22s var(--ease), color .22s var(--ease);
}
.rail-item .material-symbols-rounded{ font-size: 24px; transition: transform .28s var(--ease); }
.rail-item:hover{ background: var(--surface-hover); color: var(--on-surface); }
.rail-item.active{ background: var(--primary-container); color: var(--primary); }
.rail-item.active .material-symbols-rounded{ font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.rail-spacer{ flex: 1; }
.rail-sync{ display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--on-surface-variant); }
.sync-dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--on-surface-variant); transition: background .3s; }
.sync-dot.online{ background: var(--success); box-shadow: 0 0 12px var(--success); animation: pulseDot 2.4s infinite; }
.sync-dot.connecting{ background: var(--tertiary); animation: pulseDot 1.1s infinite; }
.sync-dot.offline{ background: var(--danger); }
@keyframes pulseDot{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.35);opacity:.55;} }

.content{ margin-left: var(--rail-w); width: calc(100% - var(--rail-w)); min-height: 100vh; }
.content-inner{ max-width: 1180px; margin: 0 auto; padding: 26px clamp(16px, 3.2vw, 44px) 90px; }

.topbar{ display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.topbar-left{ display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topbar-title{ margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--on-surface-variant); }
.topbar-title b{ color: var(--on-surface); background: linear-gradient(90deg, var(--primary), var(--tertiary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sync-pill{
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: var(--r-full);
  border: 1px solid var(--outline); background: var(--surface); font-size: 11.5px; font-weight: 600; color: var(--on-surface-variant);
}
.sync-pill .material-symbols-rounded{ font-size: 15px; color: var(--primary); }
.topbar-right{ display: flex; align-items: center; gap: 8px; }
.icon-btn{
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r-full);
  border: 1px solid var(--outline); background: var(--surface); color: var(--on-surface); cursor: pointer; transition: background .22s;
}
.icon-btn:hover{ background: var(--surface-hover); }
.icon-btn.user-photo{ background-size: cover; background-position: center; }
.icon-btn.user-photo .material-symbols-rounded{ display: none; }

.card{
  position: relative; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-lg);
  backdrop-filter: blur(20px); box-shadow: var(--shadow-soft); overflow: hidden; transition: transform .3s var(--ease), border-color .3s;
}
.muted{ color: var(--on-surface-variant); }
.chip{ display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--r-full); font-size: 11px; font-weight: 700; text-transform: uppercase; background: var(--primary-container); color: var(--primary); }
.chip.chip-secondary{ background: var(--secondary-container); color: var(--secondary); }
.chip.chip-outline{ background: transparent; border: 1px solid var(--outline); color: var(--on-surface-variant); }

.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px;
  border-radius: var(--r-full); border: none; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: transform .2s, box-shadow .2s, background .2s, opacity .2s; white-space: nowrap; text-decoration: none;
}
.btn:active{ transform: scale(.96); }
.btn:disabled{ opacity: .6; cursor: not-allowed; }
.btn-filled{ background: linear-gradient(135deg, var(--primary), var(--tertiary)); color: var(--on-primary); box-shadow: 0 8px 22px rgba(103,80,164,.24); }
html[data-theme="light"] .btn-filled{ color: #fff; }
.btn-tonal{ background: var(--primary-container); color: var(--primary); }
.btn-outline{ background: transparent; border: 1px solid var(--outline); color: var(--on-surface); }
.btn.full{ width: 100%; }

.view{ display: none; }
.view.active{ display: block; animation: fadeUp .45s var(--ease) both; }
@keyframes fadeUp{ from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.view-head{ margin-bottom: 22px; }
.view-head h1{ margin: 0 0 6px; font-size: clamp(24px, 3.4vw, 34px); font-weight: 900; letter-spacing: -.025em; }
.view-head h1 .accent{ background: linear-gradient(120deg, var(--primary), var(--tertiary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.view-head p{ margin: 0; font-size: 14.5px; }
.view-head-row{ display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }

.section-title{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 34px 0 16px; }
.section-title h2{ margin: 0; font-size: 17px; font-weight: 700; }
.section-title .link{ background: none; border: none; padding: 0; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--primary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.section-title .link:hover{ text-decoration: underline; }

.hero{ display: flex; align-items: center; gap: clamp(20px, 4vw, 44px); padding: clamp(20px, 3vw, 34px); border-radius: var(--r-xl); flex-wrap: wrap; }
.ring-wrap{ position: relative; width: 216px; height: 216px; flex: 0 0 auto; margin-inline: auto; }
.ring{ width: 100%; height: 100%; transform: rotate(-90deg); position: relative; z-index: 1; }
.ring-track{ fill: none; stroke: var(--outline); stroke-width: 13; }
.ring-progress{ fill: none; stroke: url(#ringGrad); stroke-width: 13; stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring-center{ position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
.ring-level{ font-size: 56px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--primary), var(--tertiary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ring-label{ font-size: 10px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--on-surface-variant); }
.hero-info{ flex: 1 1 260px; min-width: 240px; }
.hero-xp{ display: flex; align-items: baseline; gap: 8px; font-size: clamp(32px, 5vw, 44px); font-weight: 900; line-height: 1.05; margin-bottom: 4px; }
.hero-xp span:last-child{ font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--on-surface-variant); }
.xp-bar{ height: 8px; border-radius: var(--r-full); background: var(--outline); overflow: hidden; margin-bottom: 18px; }
.xp-bar > i{ display: block; height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--tertiary)); transition: width .9s var(--ease); }
.hero-chips{ display: flex; flex-wrap: wrap; gap: 8px; }

.stats{ display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 14px; margin-top: 18px; }
.stat{ padding: 18px; border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 10px; }
.stat-icon{ width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--primary-container); color: var(--primary); }
.stat-value{ font-size: 25px; font-weight: 900; line-height: 1; }
.stat-label{ font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--on-surface-variant); }

.missions-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.mission-card{ padding: 22px; display: flex; flex-direction: column; gap: 14px; border-radius: var(--r-lg); }
.mission-top{ display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mission-icon{ width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--primary-container); color: var(--primary); }
.mission-card h3{ margin: 0; font-size: 16.5px; font-weight: 700; }
.mission-card p{ margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--on-surface-variant); flex: 1; }
.mission-foot{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.xp-badge{ font-size: 13px; font-weight: 900; color: var(--primary); background: var(--primary-container); padding: 6px 13px; border-radius: var(--r-full); }

.crowdsource-box{
  background: var(--surface-solid); border: 1px solid var(--outline); border-radius: var(--r-lg);
  padding: 22px; margin-top: 16px; display: flex; flex-direction: column; gap: 14px;
}
.crowdsource-box h4{ margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--primary); }
.crowdsource-preview{
  padding: 16px; border-radius: var(--r-md); background: var(--bg); border: 1px solid var(--outline);
  font-family: monospace; font-size: 14px; text-align: center; letter-spacing: .05em; color: var(--on-surface); word-break: break-word;
}
.crowdsource-input{
  width: 100%; padding: 13px 16px; border-radius: var(--r-sm); border: 1px solid var(--outline);
  background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: 14px; outline: none;
}
.crowdsource-input:focus{ border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }

.rank-list{ display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-lg); }
.rank-row{
  display: grid; grid-template-columns: 34px 44px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid transparent;
}
.rank-row.self{ border-color: var(--primary); background: var(--primary-container); }
.rank-pos{ font-size: 15px; font-weight: 900; color: var(--on-surface-variant); text-align: center; }
.rank-avatar{
  width: 44px; height: 44px; border-radius: var(--r-full); display: grid; place-items: center;
  font-size: 14px; font-weight: 800; color: var(--on-primary); background: linear-gradient(135deg, var(--primary), var(--tertiary));
  background-size: cover; background-position: center; overflow: hidden;
}
html[data-theme="light"] .rank-avatar{ color: #fff; }
.rank-info{ min-width: 0; }
.rank-name{ display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-meta{ font-size: 11.5px; color: var(--on-surface-variant); }
.rank-xp{ font-size: 14px; font-weight: 900; color: var(--primary); }

.forum-banner{
  padding: 14px 18px; border-radius: var(--r-md);
  background: var(--primary-container); border: 1px solid var(--primary);
  color: var(--on-surface); font-size: 13px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
}
.forum-banner .material-symbols-rounded{ color: var(--primary); flex: 0 0 auto; }
.forum-filters{ display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.forum-filter{
  padding: 8px 16px; border-radius: var(--r-full);
  border: 1px solid var(--outline); background: var(--surface);
  color: var(--on-surface-variant); font-family: inherit;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: all .2s var(--ease);
}
.forum-filter:hover{ background: var(--surface-hover); }
.forum-filter.active{
  background: var(--primary-container); border-color: var(--primary); color: var(--primary);
}
.forum-list{ display: flex; flex-direction: column; gap: 12px; }
.forum-card{
  padding: 18px 20px; border-radius: var(--r-lg); cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.forum-card:hover{ transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow); }
.forum-card-top{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.forum-cat{
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--r-full);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  background: var(--primary-container); color: var(--primary);
}
.forum-cat.cat-duvidas{ background: var(--secondary-container); color: var(--secondary); }
.forum-cat.cat-dicas{ background: rgba(129,201,149,.16); color: var(--success); }
.forum-cat.cat-projetos{ background: rgba(239,184,200,.20); color: var(--tertiary); }
.forum-card h3{ margin: 0 0 8px; font-size: 16px; font-weight: 700; line-height: 1.35; color: var(--on-surface); }
.forum-card p{
  margin: 0 0 12px; font-size: 13.5px; color: var(--on-surface-variant); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.forum-card-foot{
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 12px; color: var(--on-surface-variant);
}
.forum-author{ display: flex; align-items: center; gap: 8px; }
.forum-author-av{
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--tertiary));
  color: var(--on-primary); font-weight: 800; font-size: 10px;
  display: grid; place-items: center; flex: 0 0 auto;
  background-size: cover; background-position: center;
}
html[data-theme="light"] .forum-author-av{ color: #fff; }
.forum-replies{ display: inline-flex; align-items: center; gap: 4px; }
.forum-replies .material-symbols-rounded{ font-size: 15px; }
.forum-empty{
  padding: 50px 20px; text-align: center; color: var(--on-surface-variant);
  border: 1px dashed var(--outline); border-radius: var(--r-lg);
}
.forum-empty .material-symbols-rounded{
  font-size: 44px; color: var(--primary); display: block; margin-bottom: 12px;
}

.dialog.dialog-wide{ max-width: 640px; }
.new-post-form{ display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.new-post-form label{
  font-size: 12px; font-weight: 600; color: var(--on-surface-variant);
  text-transform: uppercase; letter-spacing: .05em;
}
.new-post-form input,
.new-post-form textarea,
.new-post-form select{
  width: 100%; padding: 13px 16px;
  border-radius: var(--r-sm); border: 1px solid var(--outline);
  background: var(--surface); color: var(--on-surface);
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.new-post-form textarea{ min-height: 130px; resize: vertical; }
.new-post-form input:focus,
.new-post-form textarea:focus,
.new-post-form select:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-container);
}
.post-detail-head{ margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--outline); }
.post-detail-head h2{ margin: 8px 0 10px; font-size: 20px; font-weight: 800; line-height: 1.3; }
.post-detail-body{
  font-size: 14px; line-height: 1.6; color: var(--on-surface);
  white-space: pre-wrap; word-break: break-word; margin-bottom: 22px;
}
.replies-title{
  margin: 20px 0 12px; font-size: 12px; font-weight: 700; color: var(--on-surface-variant);
  text-transform: uppercase; letter-spacing: .08em;
  display: flex; align-items: center; gap: 8px;
}
.replies-title span{
  background: var(--primary-container); color: var(--primary);
  padding: 2px 10px; border-radius: var(--r-full); font-size: 11px;
}
.reply-list{ display: flex; flex-direction: column; gap: 10px; }
.reply-item{
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-md);
}
.reply-head{
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 12px; color: var(--on-surface-variant);
}
.reply-head b{ color: var(--on-surface); font-weight: 600; }
.reply-body{ font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.reply-form{
  display: flex; flex-direction: column; gap: 10px; margin-top: 16px;
  padding-top: 16px; border
