<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Grid — Revolts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container WebGL / Three.js -->
    <div id="canvas-container"></div>

    <!-- HUD (FPS / DIST / CHUNK) -->
    <div id="hud">
        <div>FPS <span id="fps-value">--</span></div>
        <div>DIST <span id="dist-value">0.0</span>m</div>
        <div>CHUNK <span id="chunk-value">0,0</span></div>
    </div>

    <!-- Interface principal (header/nav/instruções/footer) -->
    <div class="ui-overlay">
        <header>
            <h1>THE GRID</h1>
            <nav>
                <a href="index.html">Início</a>
                <a href="pages/sobre/">Sobre</a>
                <a href="pages/termos/">Termos de Uso</a>
                <a href="pages/privacidade/">Privacidade</a>
                <a href="pages/contato/">Contato</a>
            </nav>
        </header>

        <div class="instructions" id="instructions">
            <p>CLIQUE PARA ENTRAR NA EXPERIÊNCIA</p>
            <p class="hint">Use W, A, S, D ou Setas para navegar | Mouse para olhar | Espaço para pular</p>
        </div>

        <footer>
            <p>© Revolts.com.br — Todos os direitos reservados.</p>
        </footer>
    </div>

    <!-- UI exclusiva de mobile -->
    <div id="mobile-ui" class="hidden">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
        <button id="jump-button" type="button">JUMP</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
