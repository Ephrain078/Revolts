<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0e14" />
<title>Revolts — Portal de Missões (Nuvem Firebase)</title>

<!-- Firebase SDK v10 (Modular CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Credenciais do Firebase configuradas para o projeto Revolts
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI", // Encontre em "Configurações do Projeto" no Console do Firebase
    authDomain: "revolts-b8c77.firebaseapp.com",
    projectId: "revolts-b8c77",
    storageBucket: "revolts-b8c77.appspot.com",
    messagingSenderId: "554456699154",
    appId: "1:554456699154:web:f379970293c67b0fbf23cb"
  };

  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ID único para identificar o agente nesta sessão
  let agentId = localStorage.getItem('revolts_agent_id');
  if (!agentId) {
    agentId = 'agente_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('revolts_agent_id', agentId);
  }

  const DEFAULT_MISSIONS = [
    { id: 'm1', cat: 'vision', title: 'Rotulagem de Objetos Urbanos', desc: 'Identifique semáforos, faixas e placas em capturas de rua.', xp: 50, done: 2, total: 5, accent: 'var(--g-blue)' },
    { id: 'm2', cat: 'nlp', title: 'Análise de Sentimento PT-BR', desc: 'Classifique expressões regionais e gírias brasileiras.', xp: 40, done: 4, total: 5, accent: 'var(--g-green)' },
    { id: 'm3', cat: 'maps', title: 'Verificação de Acessibilidade', desc: 'Confirme rampas e entradas acessíveis em locais públicos.', xp: 75, done: 1, total: 4, accent: 'var(--g-yellow)' },
    { id: 'm4', cat: 'vision', title: 'Transcrição OCR Manuscrita', desc: 'Valide palavras digitalizadas de documentos históricos.', xp: 60, done: 0, total: 5, accent: 'var(--g-red)' }
  ];

  window.revoltsState = {
    xp: 120,
    completed: 7,
    streak: 3,
    secrets: 0,
    theme: 'dark',
    missions: DEFAULT_MISSIONS
  };

  // Carrega ou inicializa dados do Firestore
  async function initCloudDB() {
    try {
      const docRef = doc(db, "agents", agentId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        window.revoltsState = docSnap.data();
      } else {
        await setDoc(docRef, window.revoltsState);
      }
      applyTheme(window.revoltsState.theme || 'dark');
      renderAll();
      listenToGlobalRank();
      showSnack('Conectado com sucesso ao Firestore!');
    } catch (err) {
      console.error("Erro ao conectar no Firebase:", err);
      showSnack('Erro ao conectar na nuvem. Verifique sua apiKey.');
    }
  }

  window.saveCloudDB = async function() {
    try {
      const docRef = doc(db, "agents", agentId);
      await setDoc(docRef, window.revoltsState, { merge: true });
      renderAll();
    } catch (err) {
      console.error("Erro ao salvar dados:", err);
    }
  }

  // Sincroniza o Ranking Global em tempo real do Firestore
  function listenToGlobalRank() {
    onSnapshot(collection(db, "agents"), (snapshot) => {
      const players = [];
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        players.push({
          name: docSnap.id === agentId ? 'Você (Agente #042)' : `Agente_${docSnap.id.substring(0,5)}`,
          xp: data.xp || 0,
          accent: docSnap.id === agentId ? 'var(--g-blue)' : 'var(--g-green)'
        });
      });
      players.sort((a, b) => b.xp - a.xp);
      renderRankList(players);
    });
  }

  window.initCloudDB = initCloudDB;
</script>

<style>
/* ============================================================
   DESIGN TOKENS (Material You / M3)
   ============================================================ */
:root {
  --g-blue:   #1a73e8;
  --g-red:    #ea4335;
  --g-yellow: #fbbc04;
  --g-green:  #34a853;

  --shape-xs: 8px;
  --shape-sm: 12px;
  --shape-md: 16px;
  --shape-lg: 24px;
  --shape-xl: 28px;
  --shape-full: 999px;

  --dur-short: 150ms;
  --dur-med:   300ms;
  --dur-long:  500ms;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
}

[data-theme="light"] {
  --primary: #1a73e8; --on-primary: #ffffff; --primary-container: #d3e3fd; --on-primary-container: #041e49;
  --secondary: #34a853; --surface: #f7f9fc; --surface-1: #ffffff; --surface-2: #eef2f8; --surface-3: #e3e9f2;
  --on-surface: #1b1f24; --on-surface-variant: #44474e; --outline: #c9ced6; --outline-variant: #e2e6ec;
  --scrim: rgba(20, 26, 36, .45); --glow-hover: 0 8px 28px rgba(26, 115, 232, .18);
  --grid-line: rgba(26, 115, 232, .06); --grid-size: 44px;
}

[data-theme="dark"] {
  --primary: #a8c7fa; --on-primary: #062e6f; --primary-container: #0842a0; --on-primary-container: #d3e3fd;
  --secondary: #7ee2a8; --surface: #0a0e14; --surface-1: #111720; --surface-2: #18202b; --surface-3: #212b38;
  --on-surface: #e6e9ef; --on-surface-variant: #9aa3b2; --outline: #2a333f; --outline-variant: #1c2430;
  --scrim: rgba(0, 0, 0, .6); --glow-primary: 0 0 24px rgba(26, 115, 232, .28);
  --glow-hover: 0 8px 32px rgba(26, 115, 232, .28); --grid-line: rgba(120, 170, 255, .05); --grid-size: 44px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: "Google Sans", "Product Sans", Roboto, system-ui, sans-serif;
  background: var(--surface); color: var(--on-surface); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size); pointer-events: none;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(600px 400px at 8% -5%, rgba(26,115,232,.22), transparent 70%),
              radial-gradient(520px 360px at 95% 8%, rgba(52,168,83,.16), transparent 70%);
}

h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; }

/* Layout Shell */
.app { display: grid; grid-template-columns: 88px 1fr; grid-template-rows: 72px 1fr; grid-template-areas: "bar bar" "rail main"; min-height: 100dvh; }

.app-bar {
  grid-area: bar; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-5); background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(18px); border-bottom: 1px solid var(--outline-variant);
}
.brand { display: flex; align-items: center; gap: var(--sp-3); text-decoration: none; color: inherit; }
.brand__mark {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--shape-sm);
  background: linear-gradient(135deg, var(--g-blue), var(--g-green) 55%, var(--g-yellow));
}
.brand__mark svg { width: 22px; height: 22px; fill: #fff; }
.brand__name { font-size: 1.22rem; font-weight: 600; background: linear-gradient(90deg, var(--on-surface), var(--primary)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.app-bar__spacer { flex: 1; }
.search { display: flex; align-items: center; gap: var(--sp-2); width: min(360px, 34vw); padding: 0 var(--sp-4); height: 44px; border-radius: var(--shape-full); background: var(--surface-2); border: 1px solid transparent; }
.search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--on-surface); font-size: .92rem; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: var(--shape-full); background: transparent; color: var(--on-surface-variant); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--on-surface); }
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
.avatar { width: 40px; height: 40px; border-radius: var(--shape-full); border: 2px solid var(--primary-container); background: linear-gradient(135deg, var(--g-blue), var(--g-red)); display: grid; place-items: center; color: #fff; font-weight: 600; font-size: .9rem; }

/* Nav Rail */
.nav-rail {
  grid-area: rail; position: sticky; top: 72px; height: calc(100dvh - 72px); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  padding: var(--sp-4) 0; border-right: 1px solid var(--outline-variant); background: color-mix(in srgb, var(--surface) 55%, transparent); backdrop-filter: blur(14px);
}
.rail-item { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: transparent; color: var(--on-surface-variant); font-size: .66rem; cursor: pointer; border-radius: var(--shape-md); }
.rail-item__pill { width: 52px; height: 32px; display: grid; place-items: center; border-radius: var(--shape-full); }
.rail-item svg { width: 22px; height: 22px; fill: currentColor; }
.rail-item.is-active { color: var(--on-primary-container); }
.rail-item.is-active .rail-item__pill { background: var(--primary-container); }
.rail-rail-spacer { flex: 1; }

/* Content */
.content { grid-area: main; padding: var(--sp-6) clamp(var(--sp-4), 4vw, var(--sp-7)) var(--sp-7); max-width: 1240px; width: 100%; margin: 0 auto; }
.view { display: none; }
.view.is-active { display: block; }

/* Hero */
.hero {
  display: grid; grid-template-columns: 1fr auto; gap: var(--sp-5); align-items: center; padding: clamp(var(--sp-5), 3vw, var(--sp-6));
  border-radius: var(--shape-xl); background: linear-gradient(135deg, color-mix(in srgb, var(--primary-container) 70%, var(--surface-1)), var(--surface-1));
  border: 1px solid var(--outline-variant); margin-bottom: var(--sp-6);
}
.hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 600; margin-bottom: var(--sp-2); }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--g-blue), var(--g-green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--on-surface-variant); font-size: .95rem; max-width: 46ch; }
.hero__stats { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
.stat-chip { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 8px 14px; border-radius: var(--shape-full); background: var(--surface-1); border: 1px solid var(--outline-variant); font-size: .82rem; }
.stat-chip svg { width: 16px; height: 16px; }

/* Level Ring */
.level-ring { position: relative; width: 148px; height: 148px; display: grid; place-items: center; flex: none; }
.level-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.level-ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.level-ring .track { stroke: var(--surface-3); }
.level-ring .bar { stroke: url(#ringGrad); stroke-dasharray: 264; stroke-dashoffset: 264; transition: stroke-dashoffset 1s ease; }
.level-ring__label { text-align: center; }
.level-ring__label b { display: block; font-size: 1.85rem; font-weight: 700; }
.level-ring__label span { font-size: .68rem; text-transform: uppercase; color: var(--on-surface-variant); }

/* Missions Grid */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-4); flex-wrap: wrap; }
.section-head h2 { font-size: 1.18rem; font-weight: 600; }
.section-head p { font-size: .82rem; color: var(--on-surface-variant); }
.mission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: var(--sp-4); }

.mission {
  display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-5); border-radius: var(--shape-lg);
  background: var(--surface-1); border: 1px solid var(--outline-variant); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
}
.mission:hover { transform: translateY(-4px); box-shadow: var(--glow-hover); border-color: var(--primary); }
.mission__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
.mission__icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: var(--shape-md); background: color-mix(in srgb, var(--accent, var(--primary)) 14%, var(--surface-1)); color: var(--accent, var(--primary)); }
.mission__icon svg { width: 24px; height: 24px; fill: currentColor; }
.mission__points { font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: var(--shape-full); background: color-mix(in srgb, var(--accent, var(--primary)) 14%, transparent); color: var(--accent, var(--primary)); }
.mission__title { font-size: 1rem; font-weight: 600; }
.mission__desc { font-size: .82rem; color: var(--on-surface-variant); line-height: 1.5; flex: 1; }
.progress { height: 8px; border-radius: var(--shape-full); background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.progress__bar { height: 100%; width: 0; background: var(--accent, var(--primary)); transition: width 1s ease; }

/* Snackbar */
.snackbar { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translate(-50%, 140%); display: flex; align-items: center; gap: var(--sp-3); padding: 12px 20px; border-radius: var(--shape-sm); background: var(--surface-3); color: var(--on-surface); border: 1px solid var(--outline); box-shadow: 0 10px 34px rgba(0,0,0,.35); transition: transform .3s ease; }
.snackbar.is-open { transform: translate(-50%, 0); }
.snackbar__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "bar" "main"; }
  .nav-rail { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: 72px; flex-direction: row; justify-content: space-around; z-index: 45; background: var(--surface); border-top: 1px solid var(--outline-variant); }
  .rail-rail-spacer { display: none; }
  .content { padding-bottom: 120px; }
}
</style>
</head>

<body>

<div class="app">
  <header class="app-bar">
    <a class="brand" href="#">
      <span class="brand__mark"><svg viewBox="0 0 24 24"><path d="M12 2 2 13h4v9h5v-6h2v6h5v-9h4L12 2Z"/></svg></span>
      <span class="brand__name">Revolts (Cloud)</span>
    </a>
    <div class="app-bar__spacer"></div>
    <div class="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="var(--on-surface-variant)"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg><input type="search" placeholder="Buscar missões…" /></div>
    <button class="icon-btn" id="themeToggle"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
    <div class="avatar">AG</div>
  </header>

  <nav class="nav-rail">
    <button class="rail-item is-active" data-view="home"><span class="rail-item__pill"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12h-6v-7h-4v7Z"/></svg></span>Início</button>
    <button class="rail-item" data-view="missions"><span class="rail-item__pill"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4Z"/></svg></span>Missões</button>
    <span class="rail-rail-spacer"></span>
    <button class="rail-item" data-view="rank"><span class="rail-item__pill"><svg viewBox="0 0 24 24"><path d="M7 21H4v-8h3Zm6 0h-3V3h3Zm7 0h-3V9h3Z"/></svg></span>Ranking</button>
    <button class="rail-item" data-view="profile"><span class="rail-item__pill"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg></span>Perfil</button>
  </nav>

  <main class="content">
    <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a73e8"/><stop offset="50%" stop-color="#34a853"/><stop offset="100%" stop-color="#fbbc04"/></linearGradient></defs></svg>

    <!-- VIEW: INÍCIO -->
    <section class="view is-active" id="view-home">
      <div class="hero">
        <div>
          <span style="font-size:.74rem; font-weight:600; color:var(--primary); text-transform:uppercase;">Firebase Cloud Ativo</span>
          <h1>Bem-vindo ao <em>Revolts</em></h1>
          <p>Seus dados de XP e missões estão sincronizados diretamente na nuvem em tempo real.</p>
          <div class="hero__stats">
            <div class="stat-chip">⭐ XP: <strong id="statXp">0</strong></div>
            <div class="stat-chip">✅ Missões: <strong id="statMissions">0</strong></div>
          </div>
        </div>
        <div class="level-ring">
          <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" id="levelRingBar" cx="50" cy="50" r="42"/></svg>
          <div class="level-ring__label"><b id="levelNumber">1</b><span>Nível</span></div>
        </div>
      </div>
      <div class="section-head"><h2>Missões Disponíveis</h2></div>
      <div class="mission-grid" id="missionGrid"></div>
    </section>

    <!-- VIEW: MISSÕES -->
    <section class="view" id="view-missions">
      <div class="section-head"><h2>Central de Missões</h2></div>
      <div class="mission-grid" id="missionGridFull"></div>
    </section>

    <!-- VIEW: RANKING -->
    <section class="view" id="view-rank">
      <div class="section-head"><h2>Ranking Global em Tempo Real (Cloud)</h2></div>
      <div class="mission-grid" id="rankList"></div>
    </section>

    <!-- VIEW: PERFIL -->
    <section class="view" id="view-profile">
      <div class="section-head"><h2>Conquistas do Agente</h2></div>
      <div class="mission-grid" id="badgesGrid"></div>
    </section>
  </main>
</div>

<div class="snackbar" id="snackbar"><span class="snackbar__dot"></span><span id="snackbarMsg">Conectando...</span></div>

<script>
let snackTimer;
function showSnack(msg) {
  const sb = document.getElementById('snackbar');
  document.getElementById('snackbarMsg').textContent = msg;
  sb.classList.add('is-open');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => sb.classList.remove('is-open'), 3500);
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  window.revoltsState.theme = t;
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = window.revoltsState.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  window.saveCloudDB();
});

document.querySelectorAll('.rail-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.rail-item').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('is-active'));
    document.getElementById(`view-${btn.dataset.view}`).classList.add('is-active');
  });
});

window.completeMissionStep = function(id) {
  const m = window.revoltsState.missions.find(item => item.id === id);
  if (!m) return;
  m.done = m.done < m.total ? m.done + 1 : 1;
  window.revoltsState.xp += m.xp;
  window.revoltsState.completed += 1;
  window.saveCloudDB();
  showSnack(`+${m.xp} XP sincronizado na nuvem!`);
}

window.renderRankList = function(players) {
  const rankList = document.getElementById('rankList');
  rankList.innerHTML = players.map((p, i) => `
    <div class="mission" style="--accent:${p.accent}">
      <div class="mission__top"><div class="mission__icon"><strong>#${i + 1}</strong></div><span class="mission__points">${p.xp} XP</span></div>
      <h3 class="mission__title">${p.name}</h3>
      <p class="mission__desc">Nível ${Math.floor(p.xp / 150) + 1} • Sincronizado</p>
    </div>
  `).join('');
}

window.renderAll = function() {
  const state = window.revoltsState;
  const level = Math.floor(state.xp / 150) + 1;
  const xpInLevel = state.xp % 150;
  const circumference = 264;

  document.getElementById('statXp').textContent = state.xp;
  document.getElementById('statMissions').textContent = state.completed;
  document.getElementById('levelNumber').textContent = level;
  document.getElementById('levelRingBar').style.strokeDashoffset = circumference - (circumference * (xpInLevel / 150));

  const homeGrid = document.getElementById('missionGrid');
  const fullGrid = document.getElementById('missionGridFull');
  homeGrid.innerHTML = '';
  fullGrid.innerHTML = '';

  state.missions.forEach(m => {
    const pct = Math.round((m.done / m.total) * 100);
    const html = `
      <div class="mission" style="--accent:${m.accent}" onclick="completeMissionStep('${m.id}')">
        <div class="mission__top"><div class="mission__icon"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm0 7.3L4.7 6 12 2.7 19.3 6 12 9.3Zm0 4.4-7.3-3.3L2 11.7l10 5 10-5-2.7-1.3-7.3 3.3Z"/></svg></div><span class="mission__points">+${m.xp} XP</span></div>
        <h3 class="mission__title">${m.title}</h3>
        <p class="mission__desc">${m.desc}</p>
        <div class="progress"><div class="progress__bar" style="width:${pct}%"></div></div>
      </div>
    `;
    fullGrid.innerHTML += html;
    homeGrid.innerHTML += html;
  });
}

// Inicializa a conexão com o Firebase ao carregar a página
window.addEventListener('DOMContentLoaded', () => {
  window.initCloudDB();
});
</script>
</body>
</html>
