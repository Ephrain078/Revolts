<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Grid - Revolts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: monospace;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Mira Minimalista Central */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border: 1px solid #00ffff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 8px #00ffff;
      z-index: 10;
    }
    /* Botão de Salto para PC/Mobile */
    #jumpBtn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 80px;
      height: 80px;
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid #00ffff;
      border-radius: 50%;
      color: #00ffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      z-index: 20;
    }
    #jumpBtn:active {
      background: rgba(0, 255, 255, 0.4);
    }
    /* Joystick Virtual para Mobile */
    #joystick {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      touch-action: none;
      z-index: 20;
    }
    #stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      background: rgba(0, 255, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffff;
    }
    body.mobile #joystick { display: block; }
  </style>
  <!-- Three.js via CDN Oficial -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>
  <div id="jumpBtn">PULAR</div>
  <div id="joystick"><div id="stick"></div></div>

  <script>
    // --- 1. CONFIGURAÇÃO DE AMBIENTE & MOTOR MATEMÁTICO ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.003);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    container.appendChild(renderer.domElement);

    // --- 2. GERAÇÃO DA GRADE MATEMÁTICA INFINITA ---
    // Criamos uma malha procedural baseada em linhas de alta performance
    const gridSize = 600;
    const gridDivisions = 100;
    
    // Grade principal do piso
    const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x00ffff, 0x003344);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Grade espelhada no teto para dar sensação de espaço infinito cibernético
    const ceilingGrid = new THREE.GridHelper(gridSize, gridDivisions, 0xff00ff, 0x220033);
    ceilingGrid.position.y = 60;
    scene.add(ceilingGrid);

    // Linhas de horizonte dinâmicas geradas matematicamente
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
    const linesGroup = new THREE.Group();
    for (let i = -300; i <= 300; i += 30) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(i, 0, -300),
        new THREE.Vector3(i, 0, 300)
      ]);
      linesGroup.add(new THREE.Line(geo, lineMat));
    }
    scene.add(linesGroup);

    // --- 3. CONTROLES DE MOVIMENTO (GTA / PRIMEIRA PESSOA) ---
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
    if (isMobile) document.body.classList.add('mobile');

    let moveF = false, moveB = false, moveL = false, moveR = false;
    let velocityY = 0;
    const gravity = -30;
    const jumpForce = 12;
    let isJumping = false;

    let yaw = 0, pitch = 0;
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    // Clique na tela para travar o mouse no PC
    container.addEventListener('click', () => {
      if (!isMobile) container.requestPointerLock();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMobile && document.pointerLockElement !== container) return;
      if (isMobile) return;
      
      yaw -= (e.movementX || 0) * 0.002;
      pitch -= (e.movementY || 0) * 0.002;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));

      euler.set(pitch, yaw, 0);
      camera.quaternion.setFromEuler(euler);
    });

    // Teclado (WASD / Setas / Espaço)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveF = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveB = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveL = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveR = true;
      if (e.code === 'Space') triggerJump();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveF = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveB = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveL = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveR = false;
    });

    function triggerJump() {
      if (!isJumping) {
        velocityY = jumpForce;
        isJumping = true;
      }
    }

    document.getElementById('jumpBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      triggerJump();
    });

    // Joystick Mobile
    let joyActive = false, joyId = null;
    let joyVec = { x: 0, y: 0 };
    const joyEl = document.getElementById('joystick');
    const stickEl = document.getElementById('stick');

    if (joyEl) {
      joyEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        joyId = e.changedTouches[0].identifier;
        joyActive = true;
        updateJoy(e.changedTouches[0]);
      }, { passive: false });

      joyEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) if (t.identifier === joyId) updateJoy(t);
      }, { passive: false });

      const endJoy = (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
          if (t.identifier === joyId) {
            joyActive = false; joyId = null;
            joyVec = { x: 0, y: 0 };
            stickEl.style.transform = 'translate(0,0)';
          }
        }
      };
      joyEl.addEventListener('touchend', endJoy, { passive: false });
    }

    function updateJoy(t) {
      const r = joyEl.getBoundingClientRect();
      let dx = t.clientX - (r.left + r.width / 2);
      let dy = t.clientY - (r.top + r.height / 2);
      const maxR = r.width / 2 - 10;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      stickEl.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxR;
      joyVec.y = dy / maxR;
    }

    // Touch look na tela para mobile
    let lookId = null, lx = 0, ly = 0;
    container.addEventListener('touchstart', (e) => {
      if (!isMobile) return;
      for (let t of e.changedTouches) {
        if (t.clientX > window.innerWidth * 0.35 && lookId === null) {
          lookId = t.identifier; lx = t.clientX; ly = t.clientY;
        }
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (!isMobile) return;
      for (let t of e.changedTouches) {
        if (t.identifier === lookId) {
          yaw -= (t.clientX - lx) * 0.005;
          pitch -= (t.clientY - ly) * 0.005;
          pitch = Math.max(-1.4, Math.min(1.4, pitch));
          euler.set(pitch, yaw, 0);
          camera.quaternion.setFromEuler(euler);
          lx = t.clientX; ly = t.clientY;
        }
      }
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      for (let t of e.changedTouches) if (t.identifier === lookId) lookId = null;
    }, { passive: true });

    // --- 4. LOOP DE RENDERIZAÇÃO MAT
