<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>TRON ENGINE // Vetorial Neon</title>
    <style>
        :root {
            --neon: #00eaff;
            --neon-dim: #0b6b82;
            --neon-soft: rgba(0, 234, 255, 0.35);
            --bg: #02060b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: "Courier New", ui-monospace, monospace;
            color: var(--neon);
            -webkit-font-smoothing: antialiased;
        }

        #app { position: fixed; inset: 0; }
        canvas { display: block; }

        /* Overlays Cyberpunk */
        .scanlines {
            position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 234, 255, .03) 0 1px,
                transparent 1px 3px
            );
            mix-blend-mode: screen;
            opacity: .7;
        }

        .vignette {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .9) 100%);
        }

        /* HUD estilo Tron */
        .hud {
            position: fixed; z-index: 10; pointer-events: none;
            font-size: 11px; line-height: 1.8;
            letter-spacing: .18em; text-transform: uppercase;
            text-shadow: 0 0 8px var(--neon-soft);
        }
        .hud--tl { top: 20px; left: 20px; }
        .hud--tr { top: 20px; right: 20px; text-align: right; }
        .hud--bl { bottom: 20px; left: 20px; }

        .hud__title {
            font-size: 16px; font-weight: bold; letter-spacing: .4em;
            padding-bottom: 4px; margin-bottom: 6px;
            border-bottom: 1px solid var(--neon-soft);
            text-shadow: 0 0 12px var(--neon);
        }
        .hud__sub { color: var(--neon-dim); font-size: 10px; }
        .hud__row { display: flex; justify-content: space-between; gap: 20px; }
        .hud__label { color: var(--neon-dim); }

        /* Boot Screen */
        .boot {
            position: fixed; inset: 0; z-index: 50;
            display: grid; place-items: center;
            background: #02060b;
            transition: opacity .6s ease, visibility .6s ease;
        }
        .boot.is-hidden { opacity: 0; visibility: hidden; }
        .boot__title {
            font-size: 22px; font-weight: bold; letter-spacing: .5em;
            text-shadow: 0 0 15px var(--neon);
            margin-bottom: 10px;
        }
        .boot__log { font-size: 10px; letter-spacing: .3em; color: var(--neon-dim); }
    </style>
</head>
<body>

    <div id="app"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="hud hud--tl">
        <div class="hud__title">TRON ENGINE</div>
        <div class="hud__sub">MALHA VETORIAL TOPOGRÁFICA</div>
    </div>

    <div class="hud hud--tr">
        <div class="hud__row"><span class="hud__label">FPS</span><span id="statFps">--</span></div>
        <div class="hud__row"><span class="hud__label">Vértices</span><span id="statVerts">--</span></div>
        <div class="hud__row"><span class="hud__label">Draw Calls</span><span id="statCalls">--</span></div>
    </div>

    <div class="hud hud--bl">
        <div class="hud__row"><span class="hud__label">Rotacionar</span><span>Arrastar</span></div>
        <div class="hud__row"><span class="hud__label">Zoom</span><span>Scroll</span></div>
        <div class="hud__row"><span class="hud__label">Reset</span><span>[R]</span></div>
    </div>

    <div class="boot" id="boot">
        <div style="text-align: center;">
            <div class="boot__title">TRON GRID</div>
            <div class="boot__log" id="bootLog">CARREGANDO REDE NEON...</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
