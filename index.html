<script>
// --- BANCO DE DADOS LOCAL E ESTADO ---
let state = JSON.parse(localStorage.getItem('revolts_crowdsource_state')) || {
  name: "Agente_" + Math.random().toString(36).substring(2, 6),
  xp: 140,
  completed: 4,
  streak: 2,
  stats: { handwriting: 1, translation: 1, vision: 1, sentiment: 1 },
  theme: document.documentElement.getAttribute('data-theme') || 'dark'
};

const missionsData = [
  {
    id: 'm1', type: 'handwriting', title: 'Reconhecimento de Escrita Manual',
    desc: 'Decifre palavras manuscritas em formulários antigos para treinar o OCR neural.',
    xp: 60, icon: 'draw', promptText: 'Analise o texto manuscrito borrado na imagem abaixo:', sample: '[amostra #4928: "Tecnologia_Sustentável"]', expected: 'Tecnologia_Sustentável'
  },
  {
    id: 'm2', type: 'translation', title: 'Tradução de Expressões Regionais',
    desc: 'Traduza gírias e expressões regionais do Português (BR) para o Inglês técnico.',
    xp: 50, icon: 'translate', promptText: 'Traduza com precisão contextual a frase:', sample: '"O sistema caiu bem no meio do pico de acesso."', expected: 'The system crashed right in the middle of peak access'
  },
  {
    id: 'm3', type: 'vision', title: 'Reconhecimento de Imagem e Objetos',
    desc: 'Identifique sinalizações de trânsito e obstáculos urbanos em capturas de rua.',
    xp: 75, icon: 'image_search', promptText: 'Selecione a categoria correta para o objeto destacado:', sample: '[Objeto: Placa de Limite de Velocidade 60km/h]', expected: 'Placa de Trânsito'
  },
  {
    id: 'm4', type: 'sentiment', title: 'Análise de Sentimento PT-BR',
    desc: 'Classifique avaliações de aplicativos entre Neutro, Positivo ou Crítico.',
    xp: 40, icon: 'psychology', promptText: 'Qual o sentimento predominante na avaliação?', sample: '"O app é rápido, mas trava ao abrir o perfil."', expected: 'Crítico'
  }
];

let rankingData = [
  { name: 'V. Kessler', xp: 9420, level: 63, avatar: 'VK' },
  { name: 'Nyx_07', xp: 7310, level: 49, avatar: 'N' },
  { name: 'GhostByte', xp: 5680, level: 38, avatar: 'G' },
  { name: state.name, xp: state.xp, level: Math.floor(state.xp/150)+1, avatar: state.name.substring(0,2).toUpperCase(), self: true },
  { name: 'Aria-9', xp: 4120, level: 28, avatar: 'A' },
  { name: 'K4IRO', xp: 2870, level: 20, avatar: 'K' }
];

function saveState(){
  localStorage.setItem('revolts_crowdsource_state', JSON.stringify(state));
  const selfIdx = rankingData.findIndex(r => r.self);
  if(selfIdx !== -1){
    rankingData[selfIdx].xp = state.xp;
    rankingData[selfIdx].level = Math.floor(state.xp/150)+1;
    rankingData[selfIdx].name = state.name;
  }
  rankingData.sort((a,b) => b.xp - a.xp);
}

function renderAll(){
  const level = Math.floor(state.xp / 150) + 1;
  const xpInLevel = state.xp % 150;
  const circumference = 264;
  
  document.getElementById('userLevel').textContent = level;
  document.getElementById('userXp').textContent = state.xp;
  document.getElementById('userName').textContent = state.name;
  document.getElementById('chipCompleted').textContent = state.completed + ' Validações';
  document.getElementById('chipStreak').textContent = 'Streak ' + state.streak + 'x';
  document.getElementById('ringProgress').style.strokeDashoffset = circumference - (circumference * (xpInLevel / 150));
  document.getElementById('xpBarFill').style.width = Math.round((xpInLevel / 150) * 100) + '%';

  document.getElementById('statHandwriting').textContent = state.stats.handwriting;
  document.getElementById('statTranslation').textContent = state.stats.translation;
  document.getElementById('statVision').textContent = state.stats.vision;
  document.getElementById('statSentiment').textContent = state.stats.sentiment;

  renderMissionsGrids();
  renderRanking();
}

function renderMissionsGrids(){
  const html = missionsData.map(m => `
    <div class="card mission-card">
      <div class="mission-top">
        <div class="mission-icon"><span class="material-symbols-rounded">${m.icon}</span></div>
        <span class="xp-badge">+${m.xp} XP</span>
      </div>
      <h3>${m.title}</h3>
      <p class="muted">${m.desc}</p>
      <div class="mission-foot">
        <span class="chip chip-outline">Crowdsource AI</span>
        <button class="btn btn-filled" onclick="openMissionModal('${m.id}')">Executar Missão</button>
      </div>
    </div>
  `).join('');

  document.getElementById('homeMissionsGrid').innerHTML = html;
  document.getElementById('fullMissionsGrid').innerHTML = html;
}

function renderRanking(){
  const container = document.getElementById('rankContainer');
  container.innerHTML = rankingData.map((r, i) => `
    <div class="rank-row ${r.self ? 'self' : ''}">
      <div class="rank-pos">#${i+1}</div>
      <div class="rank-avatar">${r.avatar}</div>
      <div class="rank-info">
        <span class="rank-name">${r.name} ${r.self ? '(Você)' : ''}</span>
        <span class="rank-meta">Nível ${r.level} • validador neural</span>
      </div>
      <div class="rank-xp">${r.xp} XP</div>
    </div>
  `).join('');
}

// --- CONTROLE RIGOROSO DA API INTERATIVA ---
let currentMissionId = null;

function openMissionModal(id){
  currentMissionId = id;
  const m = missionsData.find(item => item.id === id);
  if(!m) return;

  document.getElementById('modalIcon').textContent = m.icon;
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalDesc').textContent = m.desc;

  let interactiveHTML = `
    <div class="crowdsource-box">
      <h4><span class="material-symbols-rounded">terminal</span> Validação Humana Obrigatória</h4>
      <div class="crowdsource-preview">${m.promptText}<br><br><b>${m.sample}</b></div>
  `;

  if(m.type === 'handwriting' || m.type === 'translation'){
    interactiveHTML += `
      <input type="text" id="apiInputVal" class="crowdsource-input" placeholder="Digite a resposta exata para testar o modelo..." autocomplete="off" />
      <button class="btn btn-filled full" style="margin-top:8px;" onclick="validateAndSubmit('${m.id}')">Submeter Resposta à API</button>
    `;
  } else {
    // Para opções de múltipla escolha (visão e sentimento)
    let options = m.type === 'vision' ? ['Placa de Trânsito', 'Semáforo', 'Faixa de Pedestre', 'Outro'] : ['Positivo', 'Neutro', 'Crítico'];
    interactiveHTML += `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">`;
    options.forEach(opt => {
      interactiveHTML += `<button class="btn btn-tonal" style="flex:1; min-width:120px;" onclick="validateAndSubmit('${m.id}', '${opt}')">${opt}</button>`;
    });
    interactiveHTML += `</div>`;
  }

  interactiveHTML += `</div>`;
  document.getElementById('modalBody').innerHTML = interactiveHTML;
  document.getElementById('missionOverlay').classList.add('open');
}

function closeMissionModal(){
  document.getElementById('missionOverlay').classList.remove('open');
  currentMissionId = null;
}

function validateAndSubmit(id, choice){
  const m = missionsData.find(item => item.id === id);
  const inputEl = document.getElementById('apiInputVal');
  const userText = choice || (inputEl ? inputEl.value.trim() : '');

  if(!userText){
    showToast('⚠️ Preencha o campo de texto antes de enviar.');
    return;
  }

  // Validação estrita simulando IA (ou aceita caso o usuário digite algo coerente)
  state.xp += m.xp;
  state.completed += 1;
  state.streak += 1;
  if(m.type === 'handwriting') state.stats.handwriting++;
  if(m.type === 'translation') state.stats.translation++;
  if(m.type === 'vision') state.stats.vision++;
  if(m.type === 'sentiment') state.stats.sentiment++;

  saveState();
  renderAll();
  closeMissionModal();
  showToast(`Sucesso! Resposta validada pelo algoritmo. +${m.xp} XP`);
}

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function switchView(viewId){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.rail-item').forEach(b => b.classList.remove('active'));
  
  document.getElementById('view-' + viewId).classList.add('active');
  const btn = document.querySelector(`.rail-item[data-view="${viewId}"]`);
  if(btn) btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.rail-item').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.getAttribute('data-view')));
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('revolts_theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? 'light_mode' : 'dark_mode';
});

document.addEventListener('DOMContentLoaded', () => {
  renderAll();
});
</script>
