const $ = (id) => document.getElementById(id);

function initials(name) {
  if (!name) return 'A';
  const p = String(name).trim().split(/\s+/).slice(0, 2);
  return p.map((s) => s.charAt(0).toUpperCase()).join('') || 'A';
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"')
    .replace(/'/g, '&#39;');
}

function timeAgo(iso) {
  if (!iso) return 'agora';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'agora';
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'agora';
  const m = Math.floor(s / 60);
  if (m < 60) return `há ${m}min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  const day = Math.floor(h / 24);
  if (day < 30) return `há ${day}d`;
  const mo = Math.floor(day / 30);
  if (mo < 12) return `há ${mo} ${mo > 1 ? 'meses' : 'mês'}`;
  return `há ${Math.floor(mo / 12)} ano(s)`;
}

let toastTimer = null;
function showToast(msg, icon = 'verified') {
  const t = $('toast');
  if (!t) return;
  $('toastMsg').textContent = msg;
  const ic = t.querySelector('.material-symbols-rounded');
  if (ic) ic.textContent = icon;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function buildLeaderboard() {
  let list;
  if (state.board && state.board.length) {
    list = state.board.map((a) => ({
      name: a.displayName || 'Agente',
      xp: Number(a.xp) || 0,
      photo: a.photoURL || null,
      uid: a.uid || null,
      self: !!(state.uid && a.uid === state.uid),
      level: Math.floor((Number(a.xp) || 0) / 150) + 1
    }));
  } else {
    list = MOCK_AGENTS.map((a) => ({
      name: a.name,
      xp: a.xp,
      level: Math.floor(a.xp / 150) + 1,
      photo: null,
      uid: null,
      self: false
    }));
  }
  const me = {
    name: state.name,
    xp: state.xp,
    level: Math.floor(state.xp / 150) + 1,
    photo: state.photo,
    uid: state.uid,
    self: true
  };
  let hasMe = false;
  for (let i = 0; i < list.length; i++) {
    if (list[i].self || (state.uid && list[i].uid === state.uid)) {
      list[i] = me;
      hasMe = true;
      break;
    }
  }
  if (!hasMe) list.push(me);
  list.sort((a, b) => b.xp - a.xp);
  return list;
}

function renderRanking() {
  const c = $('rankContainer');
  if (!c) return;
  const list = buildLeaderboard();
  c.innerHTML = list.map((r, i) => {
    const av = r.photo
      ? `<div class="rank-avatar" style="background-image:url(${escapeHtml(r.photo)})"></div>`
      : `<div class="rank-avatar">${initials(r.name)}</div>`;
    return `
      <div class="rank-row ${r.self ? 'self' : ''}">
        <div class="rank-pos">#${i + 1}</div>
        ${av}
        <div class="rank-info">
          <span class="rank-name">${escapeHtml(r.name)}${r.self ? ' (Você)' : ''}</span>

        </div>

    `;
  }).join('');
}

// 15. COMPLETAR MISSÃO

function completeMission(id) {
  const m = missionsData.find((x) => x.id === id);
  if (!m) return;

  state.xp += m.xp;
  state.completed += 1;
  state.streak += 1;
  if (m.type === 'handwriting') state.stats.handwriting++;
  if (m.type === 'translation') state.stats.translation++;
  if (m.type === 'vision') state.stats.vision++;
  if (m.type === 'sentiment') state.stats.sentiment++;

  saveState();
  renderDashboard();
  renderRanking();
  renderAuthUI();

  // Sincroniza com o Firestore se logado
  if (state.uid) {
    updateDoc(doc(db, 'users', state.uid), {
      xp: state.xp,
      completed: state.completed,
      streak: state.streak,
      stats: state.stats,
      updatedAt: serverTimestamp()
    }).catch(console.error);
  }

  showToast(`Missão validada! +${m.xp} XP`, 'verified');
}

function goTo(view) {
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === `view-${view}`));
  document.querySelectorAll('.rail-item[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  location.hash = view;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  state.theme = t;
  saveState();
  $('themeIcon').textContent = t === 'dark' ? 'light_mode' : 'dark_mode';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#1C1B1F' : '#FFFBFE');
}
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

    html = `
      <div class="crowdsource-box">
        <h4><span class="material-symbols-rounded">terminal</span> Validação Humana Obrigatória</h4>
        <div class="crowdsource-preview" style="text-align:center;">
          <img src="${m.imageUrl}" alt="Amostra de imagem" style="max-width:100%; border-radius:12px;" />
        </div>
        <p style="margin:12px 0 8px;font-size:13px;">${escapeHtml(m.promptText)}</p>
        <input type="text" id="apiInputVal" class="crowdsource-input" placeholder="Descreva o que você vê..." autocomplete="off" />

  // ----- Missão de tradução (Wikipédia) -----
  else if (m.type === 'translation') {
    // Busca um artigo aleatório da Wikipédia em português
    let articleText = '';
    try {
      const res = await fetch('https://pt.wikipedia.org/api/rest_v1/page/random/summary');
      const data = await res.json();
      articleText = data.extract || 'A Wikipédia é uma enciclopédia livre que todos podem editar.';
    } catch (e) {
      articleText = 'A Wikipédia é uma enciclopédia livre que todos podem editar.';
    }

    html = `
      <div class="crowdsource-box">
        <h4><span class="material-symbols-rounded">terminal</span> Tradução de Artigo</h4>
        <div class="crowdsource-preview" style="text-align:left;font-family:inherit;">
          <p style="margin:0;font-size:14px;line-height:1.6;">${escapeHtml(articleText)}</p>
        </div>
        <p style="margin:12px 0 8px;font-size:13px;">${escapeHtml(m.promptText)}</p>
        <textarea id="apiInputVal" class="crowdsource-input" style="min-height:100px;resize:vertical;" placeholder="Digite a tradução..."></textarea>
        <button class="btn btn-filled full" style="margin-top:8px;" data-submit="${m.id}">Submeter Tradução</button>
      </div>
    `;
  }
  // ----- Missão de sentimento (múltipla escolha) -----
  else {
    const opts = ['Positivo', 'Neutro', 'Crítico'];
    html = `
      <div class="crowdsource-box">
        <h4><span class="material-symbols-rounded">terminal</span> Validação Humana Obrigatória</h4>
        <div class="crowdsource-preview">${escapeHtml(m.sample)}</div>
        <p style="margin:12px 0 8px;font-size:13px;">${escapeHtml(m.promptText)}</p>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
          ${opts.map((o) => `<button class="btn btn-tonal" style="flex:1; min-width:120px;" data-submit="${m.id}" data-choice="${o}">${o}</button>`).join('')}
        </div>
      </div>
    `;
  }

  $('modalBody').innerHTML = html;
  openOverlay('missionOverlay');
}

// ------------------------------------------------------------------
// 20. SUBMISSÃO DE MISSÃO (validação e chamada às APIs)
// ------------------------------------------------------------------
async function validateAndSubmit(id, choice) {
  if (missionSubmitting) return;
  missionSubmitting = true;

  try {
    const m = missionsData.find((x) => x.id === id);
    if (!m) return;

    const inputEl = $('apiInputVal');
    const userText = choice || (inputEl ? inputEl.value.trim() : '');
    if (!userText) {
      showToast('Preencha o campo antes de enviar.', 'warning');
      return;
    }

    // ----- Validação real com Google Vision API (escrita / imagem) -----
    if ((m.type === 'handwriting' || m.type === 'vision') && VISION_API_KEY !== 'SUA_CHAVE_VISION_API') {
      const featureType = m.type === 'handwriting' ? 'DOCUMENT_TEXT_DETECTION' : 'LABEL_DETECTION';
      const body = {
        requests: [{
          image: { source: { imageUri: m.imageUrl } },
          features: [{ type: featureType, maxResults: 1 }]
        }]
      };
      const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${VISION_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      // Aqui você pode comparar a resposta do usuário com o resultado da API.
      // Para simplificar, apenas verificamos se a API retornou algo.
      if (!data.responses || !data.responses[0]) {
        throw new Error('Falha na API Vision');
      }
    }

    // ----- Validação de tradução (Wikipédia) -----
    if (m.type === 'translation') {
      // Não há como validar automaticamente sem um serviço de tradução.
      // Apenas aceitamos a resposta.
    }

    closeOverlay('missionOverlay');
    completeMission(id);
  } catch (e) {
    console.error(e);
    showToast('Erro ao validar. Tente novamente.', 'error');
  } finally {
    setTimeout(() => { missionSubmitting = false; }, 300);
  }
}

// ------------------------------------------------------------------
// 21. AUTENTICAÇÃO (FIREBASE)
// ------------------------------------------------------------------
function openAuth(pendingMessage) {
  if (pendingMessage) {
    $('authPendingMsg').textContent = pendingMessage;
    $('authPendingMsg').hidden = false;
  } else {
    $('authPendingMsg').hidden = true;
  }
  openOverlay('authOverlay');
}

// Login com e‑mail/senha
$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('authEmail').value.trim();
  const pass = $('authPass').value;
  const isRegister = !$('nameField').hidden;
  const name = $('authName').value.trim();

  if (isRegister && !name) {
    $('authError').textContent = 'Informe um nome de agente.';
    return;
  }

  try {
    $('authError').textContent = '';
    $('authSubmit').disabled = true;

    let cred;
    if (isRegister) {
      cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
    } else {
      cred = await signInWithEmailAndPassword(auth, email, pass);
    }

    // O onAuthStateChanged cuidará de carregar o estado do Firestore
    closeOverlay('authOverlay');
  } catch (err) {
    $('authError').textContent = err.message;
  } finally {
    $('authSubmit').disabled = false;
  }
});

// Login com Google
$('googleBtn').addEventListener('click', async () => {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    closeOverlay('authOverlay');
  } catch (err) {
    $('authError').textContent = err.message;
  }
});

// Logout
$('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  state = defaultState();
  saveState();
  renderAuthUI();
  renderDashboard();
  renderRanking();
  closeOverlay('authOverlay');
});

// Observador de estado de autenticação
onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.uid = user.uid;
    state.email = user.email || '';
    state.name = user.displayName || user.email.split('@')[0] || 'Agente';
    state.photo = user.photoURL || null;

    // Carrega dados do Firestore
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const data = snap.data();
      state.xp = data.xp ?? state.xp;
      state.completed = data.completed ?? state.completed;
      state.streak = data.streak ?? state.streak;
      state.stats = data.stats ?? state.stats;
    } else {
      // Cria documento inicial
      await setDoc(userRef, {
        displayName: state.name,
        email: state.email,
        photoURL: state.photo,
        xp: state.xp,
        completed: state.completed,
        streak: state.streak,
        stats: state.stats,
        updatedAt: serverTimestamp()
      });
    }

    // Carrega ranking (board)
    const q = query(collection(db, 'users'), orderBy('xp', 'desc'), limit(20));
    onSnapshot(q, (snapshot) => {
      state.board = snapshot.docs.map((d) => ({ uid: d.id, ...d.data() }));
      renderRanking();
    });

    // Carrega fórum
    const postsQuery = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(50));
    onSnapshot(postsQuery, (snapshot) => {
      forumPosts = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      isFirebaseReady = true;
      renderForumBanner();
      renderForumList();
    });

    isFirebaseReady = true;
  } else {
    // Modo offline / não logado
    state.uid = null;
    state.email = '';
    state.photo = null;
    isFirebaseReady = false;
    forumPosts = MOCK_FORUM_POSTS.slice();
    state.board = [];
  }

  saveState();
  renderAuthUI();
  renderDashboard();
  renderRanking();
  renderForumBanner();
  renderForumList();
});

// ------------------------------------------------------------------
// 22. CRIAÇÃO DE NOVO TÓPICO
// ------------------------------------------------------------------
$('newPostBtn').addEventListener('click', () => {
  if (!state.uid) {
    pendingAction = 'new-post';
    openAuth('Faça login para criar um tópico.');
    return;
  }
  openOverlay('newPostOverlay');
});

$('postSubmit').addEventListener('click', async () => {
  const title = $('postTitle').value.trim();
  const body = $('postBody').value.trim();
  const category = $('postCategory').value;

  if (!title || !body) {
    $('newPostError').textContent = 'Preencha título e mensagem.';
    return;
  }

  try {
    $('newPostError').textContent = '';
    $('postSubmit').disabled = true;

    await addDoc(collection(db, 'posts'), {
      title,
      body,
      category,
      authorName: state.name,
      authorPhoto: state.photo,
      authorUid: state.uid,
      replyCount: 0,
      createdAt: serverTimestamp()
    });

    closeOverlay('newPostOverlay');
    showToast('Tópico publicado!', 'send');
  } catch (e) {
    console.error(e);
    $('newPostError').textContent = 'Erro ao publicar. Tente novamente.';
  } finally {
    $('postSubmit').disabled = false;
  }
});

// ------------------------------------------------------------------
// 23. RESPOSTA A TÓPICO
// ------------------------------------------------------------------
document.addEventListener('click', async (e) => {
  if (e.target.id === 'replySubmit') {
    const postId = currentPostId;
    const body = $('replyBody').value.trim();
    if (!body || !postId) return;

    try {
      await updateDoc(doc(db, 'posts', postId), {
        replyCount: (forumPosts.find((p) => p.id === postId)?.replyCount || 0) + 1,
        replies: arrayUnion({
          body,
          authorName: state.name,
          authorPhoto: state.photo,
          authorUid: state.uid,
          createdAt: new Date().toISOString()
        })
      });
      $('replyBody').value = '';
      showToast('Resposta enviada!', 'send');
    } catch (e) {
      console.error(e);
      showToast('Erro ao responder.', 'error');
    }
  }
});

// ------------------------------------------------------------------
// 24. ABRIR DETALHE DO TÓPICO
// ------------------------------------------------------------------
document.addEventListener('click', (e) => {
  const card = e.target.closest('.forum-card');
  if (card) {
    currentPostId = card.dataset.post;
    // Carrega respostas do Firestore, se logado
    if (state.uid) {
      getDoc(doc(db, 'posts', currentPostId)).then((snap) => {
        if (snap.exists() && snap.data().replies) {
          forumRepliesByPost[currentPostId] = snap.data().replies;
        }
        renderPostDetail(currentPostId);
        openOverlay('postDetailOverlay');
      });
    } else {
      renderPostDetail(currentPostId);
      openOverlay('postDetailOverlay');
    }
  }
});

// ------------------------------------------------------------------
// 25. DELEGAÇÃO DE EVENTOS GERAIS
// ------------------------------------------------------------------
document.addEventListener('click', (e) => {
  // Botões de missão
  const missionBtn = e.target.closest('[data-mission]');
  if (missionBtn) {
    openMissionModal(missionBtn.dataset.mission);
    return;
  }

  // Botões de submissão de missão
  const submitBtn = e.target.closest('[data-submit]');
  if (submitBtn) {
    const id = submitBtn.dataset.submit;
    const choice = submitBtn.dataset.choice;
    validateAndSubmit(id, choice);
    return;
  }

  // Fechar overlays
  if (e.target.closest('.dialog-close') || e.target.classList.contains('overlay')) {
    const overlay = e.target.closest('.overlay');
    if (overlay) overlay.classList.remove('open');
    return;
  }

  // Navegação
  const railItem = e.target.closest('.rail-item[data-view]');
  if (railItem) {
    goTo(railItem.dataset.view);
    return;
  }

  // Alternar tema
  if (e.target.closest('#themeBtn')) {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    return;
  }

  // Abrir auth
  if (e.target.closest('#authBtn')) {
    if (!state.uid) openAuth();
    else openOverlay('authOverlay');
    return;
  }

  // Filtros do fórum
  const filterBtn = e.target.closest('.forum-filter');
  if (filterBtn) {
    document.querySelectorAll('.forum-filter').forEach((b) => b.classList.remove('active'));
    filterBtn.classList.add('active');
    currentCategory = filterBtn.dataset.cat;
    renderForumList();
    return;
  }
});

// ------------------------------------------------------------------
// 26. INICIALIZAÇÃO
// ------------------------------------------------------------------
// Roteamento por hash
window.addEventListener('hashchange', () => {
  const view = location.hash.replace('#', '') || 'dashboard';
  goTo(view);
});

// Estado inicial
applyTheme(currentTheme());
renderDashboard();
renderMissionsGrids();
renderRanking();
renderForumBanner();
renderForumList();
renderAuthUI();

// Se houver hash na URL, navega para a view correspondente
if (location.hash) {
  goTo(location.hash.replace('#', ''));
}

// Expõe o estado para depuração (opcional)
window.Revolts = { getState: () => state };

// ------------------------------------------------------------------
// 27. SERVICE WORKER (opcional, para offline)
// ------------------------------------------------------------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
