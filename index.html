
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revolts - Teste Firebase</title>
  <style>
    body {
      background: #080d18;
      color: #fff;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #111b2e;
      padding: 30px;
      border-radius: 14px;
      width: min(380px, 85%);
      text-align: center;
    }

    h1 { color: #39d98a; }

    button {
      background: #39d98a;
      color: #07130d;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 8px;
    }

    #status {
      background: #080d18;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>REVOLTS</h1>
  <p>Diagnóstico Firebase</p>

  <div id="status">Inicializando Firebase...</div>

  <button id="login">Entrar com Google</button>
  <button id="logout">Sair</button>
</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAwOZScnWyjXXuLlLlY5cQRIRwHMS0-_0",
    authDomain: "revolts-b8c77.firebaseapp.com",
    projectId: "revolts-b8c77",
    storageBucket: "revolts-b8c77.firebasestorage.app",
    messagingSenderId: "554456699154",
    appId: "1:554456699154:web:f379970293c67b0fbf23cb",
    measurementId: "G-BYH8V44QHD"
  };

  const status = document.getElementById("status");

  function log(message) {
    status.innerHTML += `<br>${message}`;
  }

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    status.innerHTML = "Firebase inicializado.";

    log("Projeto: " + firebaseConfig.projectId);
    log("Autenticação: carregada.");
    log("Firestore: carregado.");

    const provider = new GoogleAuthProvider();

    document.getElementById("login").onclick = async () => {
      try {
        status.innerHTML = "Abrindo login Google...";
        await signInWithPopup(auth, provider);
      } catch (error) {
        log("ERRO LOGIN: " + error.code);
        log(error.message);
      }
    };

    document.getElementById("logout").onclick = async () => {
      try {
        await signOut(auth);
        status.innerHTML = "Sessão encerrada.";
      } catch (error) {
        log("ERRO: " + error.message);
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        status.innerHTML = "Login realizado com sucesso!";
        log("Usuário: " + user.displayName);
        log("E-mail: " + user.email);
        log("UID: " + user.uid);

        try {
          const userRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userRef);

          if (userSnap.exists()) {
            log("Documento do usuário encontrado.");
          } else {
            log("Documento ainda não existe na coleção users.");
          }
        } catch (error) {
          log("ERRO FIRESTORE: " + error.code);
          log(error.message);
        }
      } else {
        status.innerHTML = "Firebase conectado. Nenhum usuário conectado.";
      }
    });

  } catch (error) {
    status.innerHTML = "ERRO AO INICIALIZAR FIREBASE: " + error.message;
    console.error(error);
  }
</script>

</body>
</html>
