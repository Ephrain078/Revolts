<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Revolts — Missões</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-bar">
    <a class="brand" href="index.html"><span class="brand__name">Revolts — Missões</span></a>
    <div class="app-bar__spacer"></div>
    <button class="icon-btn" id="themeToggle">🌓</button>
    <button class="auth-pill" onclick="location.href='profile.html'">
      <span class="auth-pill__avatar" id="headerAvatar">?</span>
      <span id="headerUserName">Entrar</span>
    </button>
  </header>

  <nav class="nav-rail">
    <a href="index.html" class="rail-item"><span class="rail-item__pill">🏠</span>Início</a>
    <a href="missions.html" class="rail-item is-active"><span class="rail-item__pill">🎯</span>Missões</a>
    <a href="rank.html" class="rail-item"><span class="rail-item__pill">🏆</span>Ranking</a>
    <a href="profile.html" class="rail-item"><span class="rail-item__pill">⚙️</span>Perfil</a>
  </nav>

  <main class="content">
    <div class="section-head"><h2>Trilhas de Validação Ativas</h2></div>
    <div class="mission-grid" id="fullMissionGrid">Carregando missões da nuvem...</div>
  </main>
</div>

<script type="module" src="js/auth.js"></script>
<script src="js/app.js"></script>
<script type="module">
  window.refreshView = function() {
    const state = window.revoltsState;
    const grid = document.getElementById('fullMissionGrid');
    grid.innerHTML = state.missions.map(m => `
      <div class="mission" onclick="completeMission('${m.id}')" style="--accent:var(--g-green)">
        <div class="mission__top"><span class="mission__points">+${m.xp} XP</span><span>${m.done}/${m.total}</span></div>
        <h3 class="mission__title">${m.title}</h3>
        <p class="mission__desc">${m.desc}</p>
      </div>
    `).join('');
  };

  window.completeMission = function(id) {
    const m = window.revoltsState.missions.find(item => item.id === id);
    if (!m) return;
    m.done = m.done < m.total ? m.done + 1 : 1;
    window.revoltsState.xp += m.xp;
    window.revoltsState.completed += 1;
    window.saveCloudDB();
    alert(`+${m.xp} XP creditado na sua conta!`);
  };

  window.onAuthReady = () => window.refreshView();
</script>
</body>
</html>
